[project]
name = "qqpilotlinux"
version = "2.0.1"
description = "使用纯视觉 + 窗口自动化实现 QQ 消息自动回复，零 API 依赖、零注入、低封号风险。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "pytweening>=1.2.0",
    "requests>=2.34.2",
    "windmouse[pyautogui]>=1.0.2",
    "websockets>=15.0",
    "json5>=0.9.0",
    "tqdm>=4.70.1",
    "pywebview[qt]>=6.0",
    "certifi>=2026.10.19"
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
